name: Deploy React to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inject env from Secrets (optional, overrides .env.production)
        # If you set GitHub Secrets VITE_SUPABASE_URL etc., they will override .env.production
        # Otherwise .env.production (publishable key, safe to commit) is used and build works out-of-the-box
        # We write to .env.production.local which has highest priority in Vite
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production.local; echo "Injected VITE_SUPABASE_URL from Secrets"; fi
          if [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production.local; echo "Injected VITE_SUPABASE_ANON_KEY from Secrets"; fi
          if [ -n "${{ secrets.VITE_VISITOR_ENDPOINT }}" ]; then echo "VITE_VISITOR_ENDPOINT=${{ secrets.VITE_VISITOR_ENDPOINT }}" >> .env.production.local; echo "Injected VITE_VISITOR_ENDPOINT from Secrets"; fi
          echo "--- .env.production ---"; cat .env.production; if [ -f .env.production.local ]; then echo "--- .env.production.local (Secrets) ---"; cat .env.production.local; fi
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
